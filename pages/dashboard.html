<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Peserta</title>

    <link rel="stylesheet" href="../css/dashboard.css">

</head>
<body>
    
    <header>
        <h1>Dashboard Management Peserta</h1>
    </header>

    <div class="dashboard-box">
        
        <div class="dashboard-header">
            <h2>Daftar Peserta Terdaftar</h2>
            <a href="../index.html" class="btn-kembali">Kembali ke Formulir Pendaftaran</a>
        </div>

        <table>
            
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Jurusan</th>
                    <th>Kelas</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            
            <tbody id="tabelPeserta"></tbody>

        </table>

    </div>


    <script src="../js/dashboard.js"></script>

</body>
</html>
